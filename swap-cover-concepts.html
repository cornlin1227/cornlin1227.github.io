<body class="cover-concepts-page">
  <header class="concepts-head">
    <a href="/index.html#index">← 返回作品集</a>
    <div><small>SWAP ON NEXUS / COVER STUDY</small><h1>三种封面方向，<br />不是三种配色。</h1></div>
    <p>每一版都使用真实产品成果；生成图只负责环境、材质与空间。标题、产品与装饰在同一构图中共同讲述“复杂交易体验重构”。</p>
  </header>

  <main class="concepts-list">
    <article class="concept-item">
      <header><span>CONCEPT / 01</span><h2>协议之门</h2><p>电影级暗场，把 Swap 界面塑造成进入新交易协议的核心入口。</p></header>
      <figure class="swap-poster swap-poster-cinema">
        <img class="poster-bg" src="/public/covers/swap-concepts/cinematic-portal.png" alt="" />
        <div class="cinema-copy"><small>DEX EXPERIENCE REDESIGN · 2025</small><strong>ENTER<br />THE <em>TRADE.</em></strong><p>从复杂协议，抵达清晰行动。</p></div>
        <div class="cinema-ui"><img src="/public/swap/after-swap.jpg" alt="Swap On Nexus 最终交易界面" /></div>
        <div class="cinema-meta"><span>SWAP</span><i></i><span>EXPLORE</span><i></i><span>POOLS</span><i></i><span>ASSETS</span></div>
        <b class="poster-mark">(N)</b>
      </figure>
    </article>

    <article class="concept-item">
      <header><span>CONCEPT / 02</span><h2>清晰协议</h2><p>编辑设计与模块网格，把“复杂产品重组”表现为一套理性、准确的设计论证。</p></header>
      <figure class="swap-poster swap-poster-editorial">
        <img class="poster-bg" src="/public/covers/swap-concepts/editorial-grid.png" alt="" />
        <div class="editorial-copy"><small>PRODUCT / INTERACTION / INTERFACE</small><strong>COMPLEX,<br /><em>MADE CLEAR.</em></strong><p>重构功能路径、状态反馈与交易界面。</p></div>
        <div class="editorial-ui"><img src="/public/swap/after-explore.jpg" alt="Swap On Nexus 最终 Explore 界面" /></div>
        <div class="editorial-index"><b>01</b><span>OPEN<br />CHOOSE<br />SWAP</span></div>
        <div class="editorial-stamp">INDEPENDENT FULL-STACK DESIGN</div>
      </figure>
    </article>

    <article class="concept-item">
      <header><span>CONCEPT / 03</span><h2>交易动势</h2><p>以资产轨迹和高速动线制造第一眼冲击，突出连接、流转与可执行性。</p></header>
      <figure class="swap-poster swap-poster-kinetic">
        <img class="poster-bg" src="/public/covers/swap-concepts/kinetic-route.png" alt="" />
        <div class="kinetic-copy"><small>ON NEXUS · DEX PRODUCT REDESIGN</small><strong>MOVE<br />VALUE<br /><em>FORWARD.</em></strong></div>
        <div class="kinetic-ui"><img src="/public/swap/after-assets-data.png" alt="Swap On Nexus 最终资产数据界面" /></div>
        <div class="kinetic-tag"><span>BTC NATIVE</span><span>ACTION FIRST</span><span>LIVE PRODUCT</span></div>
        <div class="kinetic-arrow">↗</div>
      </figure>
    </article>
  </main>
</body>
